name: Feature Request
description: Suggest an improvement to scanning coverage or the popup experience.
title: "feat: [short description]"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem before the solution. This extension runs
        entirely in the browser, so proposals that require additional permissions
        or network endpoints need a clear justification.

  - type: textarea
    id: problem
    attributes:
      label: Problem context
      description: What does the current extension fail to do for you?
      placeholder: "On sites that hide addresses behind ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed behaviour
      description: Describe the expected result and where it should appear in the popup.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Email extraction rules
        - Popup UI / accessibility
        - Performance and runtime limits
        - Packaging or developer tooling
        - Other
    validations:
      required: true
