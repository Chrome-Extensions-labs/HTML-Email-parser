name: Bug Report
description: Report an incorrect, missing or duplicated email result in the extension popup.
title: "fix: [short description]"
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue. Please search existing open and closed
        issues first, and do not paste private email addresses into a public report —
        the hostname of the affected page is enough.

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing open and closed issues for duplicates.
          required: true
        - label: I am using the latest released extension version.
          required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Chrome version, operating system and extension version.
      placeholder: "Chrome 132 on Windows 11, extension 1.2.0"
    validations:
      required: true

  - type: input
    id: page
    attributes:
      label: Affected site
      description: The hostname (and path, if relevant) where the scan was run.
      placeholder: "example.com/contact"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe the exact sequence that produced the incorrect result.
      placeholder: |
        1. Open the page.
        2. Click the extension icon.
        3. Wait for the scan to finish.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      placeholder: "The contact address shown on the page should appear in the list."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the popup status text and any console errors, if available.
      render: shell
    validations:
      required: true

  - type: textarea
    id: markup
    attributes:
      label: Relevant markup pattern (optional)
      description: A redacted snippet of the obfuscated or encoded address that was missed.
    validations:
      required: false
